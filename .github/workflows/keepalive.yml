# Mantiene activo el proyecto de Supabase. En el plan gratuito, Supabase pausa el proyecto
# tras ~7 días sin actividad y el formulario deja de guardar registros. Una consulta diaria
# a la base (solo lectura, con la clave pública) cuenta como actividad.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '23 14 * * *' # diario, 8:23 am CDMX
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Consulta a la base
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" \
            "https://$PROJECT_REF.supabase.co/rest/v1/registrations?select=id&limit=1")
          echo "REST → $code"
          [ "$code" = "200" ] || { echo "::error::Supabase no respondió ($code). Revisa si el proyecto está pausado: Supabase → Restore project."; exit 1; }
