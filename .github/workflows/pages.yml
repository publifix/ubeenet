# Publica el sitio en GitHub Pages con cada push, en cualquier rama.
# Pages solo tiene un sitio por repo: el último push publicado es el que se ve.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: detect
        name: Detect project type
        run: |
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            echo "type=node" >> "$GITHUB_OUTPUT"
          else
            echo "type=static" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.detect.outputs.type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - if: steps.detect.outputs.type == 'node'
        name: Build (Node)
        env:
          # Ruta base del sitio en Pages, para Vite/Astro/Next/etc.
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
          for dir in dist build out _site public; do
            if [ -f "$dir/index.html" ]; then mv "$dir" _site_out; break; fi
          done
          [ -d _site_out ] || { echo "No build output with index.html found"; exit 1; }
          rm -rf _site && mv _site_out _site

      - if: steps.detect.outputs.type == 'static'
        name: Collect static files
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '.claude' \
            --exclude '_site' --exclude 'node_modules' ./ _site/
          if [ ! -f _site/index.html ]; then
            # Sin index.html todavía: publica el README como página provisional.
            {
              echo '<!doctype html><html lang="es"><head><meta charset="utf-8">'
              echo '<meta name="viewport" content="width=device-width,initial-scale=1"><title>ubeenet</title>'
              echo '<style>body{font-family:system-ui,sans-serif;max-width:42rem;margin:4rem auto;padding:0 1rem;line-height:1.6}</style>'
              echo '</head><body>'
              npx --yes marked@15.0.12 -i README.md
              echo '</body></html>'
            } > _site/index.html
          fi
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
