# Despliega las Edge Functions `register` y `reminder` y sus secrets en Supabase usando la API
# (sin conectar Supabase con GitHub). Las tablas se crean una sola vez pegando
# supabase/migrations/0001_registrations.sql en el SQL Editor de Supabase.
#
# Secrets del repo:   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, RESEND_API_KEY,
#                     TURNSTILE_SECRET (opcional)
# Variables opcionales (tienen valor por defecto): RESEND_FROM, REPLY_TO,
#                     ALLOWED_ORIGINS, SITE_PUBLIC_URL, NOTIFY_EMAILS (destinatarios de los avisos)
name: Supabase (función de registro)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'src/config/event.ts'
      - 'src/lib/validation.ts'
      - 'src/lib/ics.ts'
      - '.github/workflows/supabase.yml'

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::notice::Faltan SUPABASE_ACCESS_TOKEN o SUPABASE_PROJECT_REF en los secrets del repo; no se despliega nada."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4

      - if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - if: steps.config.outputs.ready == 'true'
        name: Sync shared code
        run: node scripts/sync-shared.mjs

      - if: steps.config.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - if: steps.config.outputs.ready == 'true'
        name: Set function secrets
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          RESEND_FROM: ${{ vars.RESEND_FROM || 'Ubeenet Eventos <eventos@ubeenetevents.com.mx>' }}
          REPLY_TO: ${{ vars.REPLY_TO || 'sales@ubeenet.com' }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS || 'https://ubeenetevents.com.mx,https://www.ubeenetevents.com.mx,https://publifix.github.io,http://localhost:4321' }}
          SITE_PUBLIC_URL: ${{ vars.SITE_PUBLIC_URL || 'https://ubeenetevents.com.mx' }}
          # Se lee NOTIFY_EMAILS (plural). La variable vieja NOTIFY_EMAIL (modo prueba) se ignora:
          # borrarla pide verificación por correo de la cuenta de GitHub, a la que no hay acceso.
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAILS || 'elia@blanconuclear.com.mx,labs.publifix@gmail.com,aaron.sanchez@ubeenet.com' }}
        run: |
          # Clave de la función reminder: derivada del token, reminder.yml la calcula igual.
          REMINDER_KEY=$(printf 'ubeenet-reminder:%s' "$SUPABASE_ACCESS_TOKEN" | sha256sum | cut -d' ' -f1)
          args=(
            "REMINDER_KEY=$REMINDER_KEY"
            "RESEND_FROM=$RESEND_FROM"
            "REPLY_TO=$REPLY_TO"
            "ALLOWED_ORIGINS=$ALLOWED_ORIGINS"
            "SITE_PUBLIC_URL=$SITE_PUBLIC_URL"
            "NOTIFY_EMAIL=$NOTIFY_EMAIL"
          )
          [ -n "$RESEND_API_KEY" ] && args+=("RESEND_API_KEY=$RESEND_API_KEY")
          [ -n "$TURNSTILE_SECRET" ] && args+=("TURNSTILE_SECRET=$TURNSTILE_SECRET")
          supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}"

      - if: steps.config.outputs.ready == 'true'
        name: Deploy functions
        run: |
          supabase functions deploy register --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy reminder --project-ref "$PROJECT_REF" --no-verify-jwt

      - if: steps.config.outputs.ready == 'true'
        name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS \
            -H "Origin: https://ubeenetevents.com.mx" \
            "https://${PROJECT_REF}.supabase.co/functions/v1/register")
          echo "OPTIONS /register → $code"
          [ "$code" = "204" ] || { echo "::error::La función no respondió 204 al preflight."; exit 1; }
          echo "::notice::Endpoint: https://${PROJECT_REF}.supabase.co/functions/v1/register"
