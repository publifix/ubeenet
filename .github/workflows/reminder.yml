# Recordatorio a todos los registrados la tarde anterior al evento.
# Programado: miércoles 25 de noviembre, ~4:00 pm CDMX (21:55 UTC; GitHub suele arrancar
# los programados con unos minutos de retraso). La función `reminder` solo envía a todos
# en las 48 h previas al evento, así que el cron no hace nada en otros años.
#
# A mano (Actions → Recordatorio → Run workflow):
#   mode = test → un correo de muestra a labs.publifix@gmail.com
#   mode = all  → a todos los registrados (force = true para enviarlo fuera de las 48 h previas)
name: Recordatorio (día antes del evento)

on:
  schedule:
    - cron: '55 21 25 11 *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = muestra a labs.publifix@gmail.com · all = a todos los registrados'
        type: choice
        options: [test, all]
        default: test
      force:
        description: 'Enviar a todos aunque no sea el día anterior al evento'
        type: boolean
        default: false

concurrency:
  group: reminder
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      MODE: ${{ github.event_name == 'schedule' && 'all' || inputs.mode }}
      FORCE: ${{ github.event_name != 'schedule' && inputs.force || false }}
    steps:
      - name: Send reminder
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::Faltan SUPABASE_ACCESS_TOKEN o SUPABASE_PROJECT_REF en los secrets del repo."
            exit 1
          fi
          # Misma derivación que supabase.yml (secret REMINDER_KEY de la función).
          KEY=$(printf 'ubeenet-reminder:%s' "$SUPABASE_ACCESS_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$KEY"
          code=$(curl -s -o response.json -w '%{http_code}' --max-time 140 -X POST \
            -H "Content-Type: application/json" \
            -H "x-reminder-key: $KEY" \
            -d "{\"mode\":\"$MODE\",\"force\":$FORCE}" \
            "https://${PROJECT_REF}.supabase.co/functions/v1/reminder")
          echo "POST /reminder ($MODE) → $code"
          cat response.json; echo
          case "$code" in
            200) echo "::notice::Recordatorio ($MODE) enviado." ;;
            409) echo "::notice::Fuera de las 48 h previas al evento; no se envió nada." ;;
            *) echo "::error::El recordatorio falló o se envió solo en parte ($code)."; exit 1 ;;
          esac
