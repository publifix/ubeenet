<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/cloud.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0d1320;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #mesh {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Fondo de la landing (desktop): 12 s en loop perfecto. Sin texto, logos ni íconos. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <canvas id="mesh" class="clip" data-start="0" data-duration="12" data-track-index="0" width="1920" height="1080"></canvas>
    </div>
    <script>
      const canvas = document.getElementById("mesh");
      const ctx = canvas.getContext("2d");
      const scene = window.BgCloud.build(1920, 1080, window.BgCloud.LAYOUTS.desktop);
      const renderAt = (t) => window.BgCloud.render(ctx, scene, t);

      // El canvas se dibuja desde el tiempo del timeline (protocolo hf-seek).
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);

      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(clock, { t: 0 }, { t: 12, duration: 12, ease: "none", onUpdate: () => renderAt(clock.t) }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
